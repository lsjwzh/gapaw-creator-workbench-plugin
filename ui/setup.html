<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>连接与设置 · Gapaw 达人工作台</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./client.js" defer></script>
  <script src="./setup.js" defer></script>
  <script src="./team.js" defer></script>
</head>
<body class="wb">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./index.html"><span class="mark" aria-hidden="true">达</span>Gapaw 达人工作台</a>
      <nav aria-label="工作台导航"><a href="./index.html">返回办公室</a><a href="./rehearsal.html">影子演练</a><a href="./index.html#outbox">发件箱</a></nav>
    </header>
    <main>
      <section class="intro">
        <h1>连接与设置</h1>
        <p>插件运行所需的数据、账号和参数都在这里设置。每一项都会自动检测；某项未完成时，只影响依赖它的功能，其他功能照常使用。账号登录在飞书或浏览器页面完成，插件不保存密码或令牌。</p>
      </section>
      <div id="setup-summary" class="notice" role="status" aria-live="polite">正在读取设置…</div>
      <div id="setup-features" class="setup-features" aria-label="功能可用情况"></div>
      <div id="setup-list" class="setup-list"></div>
      <section id="team-panel" class="card" aria-label="办公室与员工任务"></section>
      <section class="card setup-history" aria-labelledby="setup-history-title">
        <h2 id="setup-history-title">最近修改</h2>
        <ul id="setup-history" class="hint"></ul>
      </section>
    </main>
    <footer>只在你点击“发送测试信”时向测试收件邮箱发一封连接测试信；不会向达人发送任何消息。</footer>
  </div>
</body>
</html>
