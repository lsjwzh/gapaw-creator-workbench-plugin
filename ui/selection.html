<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>达人选人工作区</title><link rel="stylesheet" href="./selection.css">
<script defer src="/shared/format.js"></script><script defer src="/provider-catalog.js"></script><script defer src="/run-config.js"></script><script defer src="./data-workflow.js"></script><script defer src="./app.js"></script><script defer src="./selection-workspace.js"></script></head>
<body><div class="review-bar"><span>达人工作台 · 选人工作区</span><div><a href="./index.html">工作台总览</a> · <a href="./selection-legacy.html">历史报告入口</a></div></div>
<div class="layout"><aside><div class="brand"><span class="brand-mark">达</span>达人工作台</div><div class="nav-label">业务流程</div><nav id="navigation"></nav><div class="side-bottom">对话交给 MultiCC 执行<br>名单按版本保存到工作台<br>采用前核对身份与范围</div></aside>
<main><div class="page-head"><div><h1>找对达人，从一句话开始</h1><p id="task-title">选择环境，描述本次选人条件</p></div><div><select id="operation-picker" class="operation-picker" aria-label="选人会话"><option value="">新的选人对话</option></select> <button id="new-chat">新对话</button></div></div>
<div class="pills"><button class="pill" id="runtime"><strong id="runtime-label">选择执行配置</strong><span class="chevron">⌄</span></button><button class="pill" id="browser-pill"><span class="dot amber" id="browser-dot"></span><strong id="browser-label">选择浏览器</strong></button><button class="pill" id="kalo-pill"><span class="dot amber" id="kalo-dot"></span><span id="kalo-label">Kalodata 待核对</span></button><button class="pill" id="shop-pill"><span class="dot amber" id="shop-dot"></span><span id="shop-label">店铺待核对</span></button><button class="pill" id="workspace-pill"><span id="workspace-label">选择运营目录</span></button></div>
<div id="notice" class="notice show" role="status"><span id="notice-text">正在读取工作台…</span><button class="text-button" id="refresh">刷新</button></div>
<div class="mobile-tabs"><button id="mobile-chat" class="active">对话</button><button id="mobile-list">名单与版本</button></div>
<div class="workspace"><section class="panel" id="chat-panel"><div class="panel-head"><h2>选人对话</h2><a id="host-task" class="task-link" hidden target="_blank" rel="noopener">打开原任务 ↗</a><small id="chat-status">尚未开始</small></div><div id="conversation" class="conversation" aria-live="polite"></div>
<div class="composer-wrap"><div id="base-note" class="base-note">首次选人 · 尚无名单</div><div class="composer"><textarea id="input" aria-label="选人要求" placeholder="描述市场、商品和筛选条件；后续可以继续调整名单…"></textarea><div class="compose-actions"><button class="text-button" id="rules">本轮任务约定 ⓘ</button><button id="send" class="primary" disabled>发送 ↑</button></div></div><p class="composer-note">形成名单后由任务结构化回写；聊天回复不等于名单已保存。Ctrl／⌘ + Enter 发送。</p><button id="retry" hidden>恢复未确认投递</button></div></section>
<section class="panel mobile-hide" id="list-panel"><div class="panel-head"><h2>达人名单</h2><small id="saved-label">尚无名单版本</small></div><div id="versions" class="versions version-scroll"></div><div class="list-toolbar"><div><strong id="list-count">0</strong> <span class="muted tiny">位候选</span></div><button class="text-button" id="compare" disabled>与基准版比较 ↗</button></div><div class="delta" id="delta"></div><div id="people" class="people"></div><div id="list-status" class="list-status"></div><div class="adoption-bar"><div><span id="selection-count">已选 0 位</span><br><button class="text-button tiny" id="continue-version" disabled>基于本版继续对话</button></div><button class="primary" id="adopt" disabled>预览采用</button></div></section></div>
<div class="footer"><span>名单来源与合作事实分别保存；未知值保持未知。</span><a href="./connection-help.html">使用说明</a></div></main></div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close-dialog" aria-label="关闭">×</button></div><div id="dialog-body" class="dialog-body"></div><div id="dialog-error" class="dialog-body error" hidden role="alert"></div><div id="dialog-foot" class="dialog-foot"></div></dialog><div id="toast" role="status"></div></body></html>
