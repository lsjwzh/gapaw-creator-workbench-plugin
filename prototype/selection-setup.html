-record{background:white;border:1px solid var(--line);border-radius:11px;padding:17px 19px;margin-bottom:12px;min-width:0}.record-top{display:flex;justify-content:space-between;gap:10px;align-items:start}.record-top h3{font-size:14px}.record-top .tag{flex-shrink:0}.record-meta{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:5px}.record-status{font-size:12px;color:var(--muted);margin-top:9px}.record-actions{display:flex;gap:13px;align-items:center;flex-wrap:wrap;margin-top:10px}.record-actions button{font-size:12px}.record-details{margin-top:8px;font-size:12px;color:var(--muted)}summary{cursor:pointer}.snapshot{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f2;border-radius:8px;padding:12px;margin-top:8px;font:12px/1.8 inherit;color:var(--ink)}.snapshot.path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.continue-panel{border-top:1px solid var(--line);margin-top:12px;padding-top:14px}.continue-panel .field{margin-top:10px}.continue-panel .actions{margin-top:10px}.continue-panel textarea{min-height:90px;font-size:12px}.simulation{margin-top:26px;padding:14px 17px;border:1px dashed #d2dbcd;border-radius:10px;color:var(--muted);font-size:12px}.simulation summary{font-weight:550}.simulation-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.simulation p{margin-top:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.env-options{margin-top:23px;padding-top:20px;border-top:1px solid var(--line)}.env-options summary{font-size:13px;font-weight:550}.env-options p{font-size:12px;color:var(--muted);margin:10px 0 13px}.footnote{text-align:center;font-size:11px;color:#8c9989;margin-top:24px}.toast{pointer-events:none;position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#263f35;color:white;padding:12px 18px;border-radius:9px;max-width:90vw;z-index:10;box-shadow:0 7px 30px #17332320;text-align:center;font-size:13px}.hidden{display:none!important}.progress{height:3px;back <div class="shell">
<header class="topbar"><div class="brand"><span class="mark" id="brandMark">M</span><span id="brandText">MultiCC · 插件管理（演示）</span></div><div class="host-toolbar"><button class="subtle hidden" id="backToPlugins" onclick="openPluginManager()">返回插件管理 →</button><span class="tag warn">交互原型 · 全部状态模拟</span></div></header>
<div id="app"></div>
<p class="footnote">本页仅保留当前页面内存，浏览器整页刷新即清空。未调用接口、安装真实插件、创建目录、创建任务或启动浏览器。</p>
</div><div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
'use strict';
const TEMPLATE = `请沿用我们已有的“扣广回本率”方法，为本次活动筛选并排序达人。

【本次需求】
商品 / 活动：请在这里补充。
期望候选数量、合作报价与其他要求：请在这里补充。

【沿用现行计算口径】
默认观察近 30 天内新发布的带货视频；执行时保存明确起止日期，同时检查起止边界，分子与分母使用同一窗口。逐条计算，保留零成交视频。
扣广后单条结余 = 视频成交额 ×（佣金前贡献率－佣金率）－该视频广告消耗－单条固定合作费－分摊寄样费。
扣广回本率 = 结余严格大于 0 的视频数 ÷ 同期新视频总数。分母包含负结余与零成交视频。
它表示历史样本中的回本命中率，不是广告 ROAS、利润率或下次合作必定回本的概率。没有同期新视频时记为不可计算。

【先确认参数，再计算】
从专属目录读取现行方法和本次活动资料，核实佣金前贡献率、佣金率、合作报价、寄样费分摊、广告费归因、统计期及币种。金额应统一币种；需要换算时记录汇率与来源。缺失时在本任务列出待补项，不把未知值当成 0。沿用方法版本，不使用“均值 × 50%”代替逐条计算。
若自然与广告佣金率不同，分别核算对应成交额与佣金；不得重复计入成交。只有总广告费而缺少逐视频归因时，先报告口径缺口，不自行分摊。入选阈值由本次活动确认，并用未舍入的精确比值判断，保留命中数与总数，不因显示为 0% 漏掉低比例命中；不把某次历史谈判的阈值自动当作通用规则。

【核验并回写】
使用工作台绑定的隔离 Chrome 环境，通过 TikTok Affiliate 和 Kalodata 核验；保留来源、窗口、币种和采集时间，不把两平台 GMV 直接相加。环境未连接时先做不依赖平台的资料核查，再在同一任务提示待连接事项。
将候选达人、回本命中数 / 同期新视频总数、扣广回本率（至少保留两位小数的百分比）、平均结余、成本假设、入选理由、证据和缺失项结构化写回工作台。非零命中不等于平均盈利。区分历史样本推算与本店实测，数据不足时不生成虚假排序。只做选人，不发送邀约、私信或邮件；后续补充继续原任务与原专属目录。`;
const host={view:'manager',selected:null,disk:null,recognized:false,loaded:false,busy:false,phase:'idle',error:'',nextFault:'none',loadCount:0,refreshCount:0,foundCount:0,message:'尚未识别到达人工作台。可主动安装，或模拟手动复制后刷新识别。'};
const state={initialized:false,settings:false,binding:null,bindings:[],draftPath:'',draftEnvs:{tt:'',k:''},envs:{tt:'',k:''},prompt:TEMPLATE,promptRevision:0,restorePending:false,records:[],busy:null,activeContinue:null,continuationDraft:'',continuationBusy:false,nextFailure:'none',dependency:'missing',bindingSeq:0,operationSeq:0,taskSeq:0};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function notice(message){$('toast').textContent=message;$('toast').classList.remove('hidden');clearTimeout(notice.timer);notice.timer=setTimeout(()=>$('toast').classList.add('hidden'),4500);}
function normalizePath(path){return path.trim().replace(/\/+$/,'');}
function pathError(value){const p=normalizePath(value);if(!p)return '请设置一个持久的专属工作目录。';if(!p.startsWith('/'))return '请使用绝对路径，例如 /Users/示例/达人运营工作区。';if(p==='/'||/^\/Users\/?$/.test(p))return '请选择专门用于达人运营的子目录。';if(/[\x00-\x1f]/.test(p)||p.split('/').some(x=>x==='.'||x==='..'))return '路径中不能包含控制字符、. 或 ..。';if(p.includes('.multicc-worktrees')||/^\/(?:private\/)?tmp(?:\/|$)/.test(p)||/^\/(?:private\/)?var\/(?:folders|tmp)(?:\/|$)/.test(p))return '请使用持久目录；任务工作树和系统临时目录会被回收。';return '';}
function updatePath(value){state.draftPath=value;const error=pathError(value);$('pathError').textContent=error;$('saveWorkspace').disabled=!!error;}
function fillExample(){state.draftPath='/Users/示例/达人运营工作区';$('workspacePath').value=state.draftPath;updatePath(state.draftPath);}
function saveWorkspace(){const error=pathError(state.draftPath);if(error){notice(error);return;}const path=normalizePath(state.draftPath);let binding=state.bindings.find(b=>b.path===path);if(!binding){binding=Object.freeze({id:'演示目录-'+(++state.bindingSeq),path});state.bindings.push(binding);}state.binding=binding;state.envs={...state.draftEnvs};state.initialized=true;state.settings=false;host.phase='ready';host.message='达人工作台已就绪（演示）；专属目录已模拟绑定，平台连接仍待独立核验。';render();notice('已保存本页的模拟目录绑定；没有检查真实可写性，也没有创建或登记目录。');}
function openSettings(){state.settings=true;state.draftPath=state.binding.path;state.draftEnvs={...state.envs};render();}
function options(value){return [{id:'',name:'稍后配置'},{id:'us',name:'美国选人身份（虚构示例）'},{id:'research',name:'数据研究身份（虚构示例）'}].map(e=>`<option value="${e.id}" ${value===e.id?'selected':''}>${e.name}</option>`).join('');}
function renderSetup(){const editing=state.initialized;return `<div class="intro"><div class="badge">${editing?'工作台设置':'首次使用 · 先安置后续工作'}</div><h1>${editing?'插件专属工作目录':'为达人运营留一个专属目录'}</h1><p>以后从工作台发起的任务，都归属这里。每次沟通可以沿着原任务继续。</p></div><div class="demo-banner">界面演示：本页只模拟路径规则与目录绑定，不读取真实文件，也不验证目录存在或可写。</div><main class="card setup"><div class="setup-head"><h2>${editing?'修改后仅影响新任务':'设置一次，后续直接发任务'}</h2><p>${editing?'历史任务保留当时的目录与提示词；继续对话仍使用原任务。':'先设置持久工作目录；Chrome 环境可以稍后再绑定。'}</p></div><div class="field"><label for="workspacePath">专属工作目录 <span class="muted">· 必填</span></label><input id="workspacePath" class="path" type="text" autocomplete="off" spellcheck="false" placeholder="/Users/示例/达人运营工作区" value="${esc(state.draftPath)}" oninput="updatePath(this.value)" aria-describedby="workspaceHint pathError"><small id="workspaceHint">选择一个长期保留的项目目录，不使用任务工作树、临时目录或 Chrome 登录目录。</small></div><p class="error" id="pathError" aria-live="polite">${esc(pathError(state.draftPath))}</p><button class="subtle" id="examplePath" onclick="fillExample()">填入虚构示例路径</button><div class="helpbox"><strong>这个目录承载什么？</strong><p>本插件发起的新任务归属此目录，方法和活动资料可以在此积累。对话原文仍由 MultiCC 管理，不代表聊天文件已经迁入目录。</p><p>它与 Chrome 的登录资料目录用途不同；Chrome 身份、登录状态与出口仍由已有的隔离出口插件管理。</p><p>正式初始化需通过宿主校验与登记，可能创建目录并初始化 Git。本原型只保存模拟绑定编号，不执行这些动作。</p></div><details class="env-options"><summary>可选：绑定现有 Chrome 隔离身份</summary><p>复用“Chrome 隔离出口启动器”，这里不重复创建环境或配置代理。以下身份均为虚构；自动化桥接尚未接入。</p><div class="grid2"><div class="field"><label for="env-tt">TikTok Affiliate 使用的身份</label><select id="env-tt" onchange="state.draftEnvs.tt=this.value">${options(state.draftEnvs.tt)}</select></div><div class="field"><label for="env-k">Kalodata 使用的身份</label><select id="env-k" onchange="state.draftEnvs.k=this.value">${options(state.draftEnvs.k)}</select></div></div></details><div class="footer"><small>仅做路径格式检查，填写通过不等于真实可用。</small><div class="actions">${editing?'<button class="secondary" onclick="state.settings=false;render()">取消</button>':''}<button id="saveWorkspace" class="primary" ${pathError(state.draftPath)?'disabled':''} onclick="saveWorkspace()">${editing?'保存新任务的目录（演示）':'保存并进入工作台（演示）'}</button></div></div></main>`;}
function updatePrompt(value){state.prompt=value;state.promptRevision++;state.restorePending=false;const button=$('sendTask');if(button)button.disabled=!!state.busy||!value.trim()||value.length>32000;if($('promptCount'))$('promptCount').textContent=value.length+' / 32000 字';if($('restoreConfirm'))$('restoreConfirm').remove();}
function requestRestore(){if(state.prompt===TEMPLATE){notice('当前已是示例提示词。');return;}state.restorePending=true;render();}
function restoreTemplate(){state.prompt=TEMPLATE;state.promptRevision++;state.restorePending=false;render();notice('已恢复示例提示词；历史任务快照保持不变。');}
function currentKey(){return state.binding.id+':'+state.promptRevision;}
function titleFor(prompt){const match=prompt.match(/(?:商品\s*\/\s*活动|商品|活动)[：:]\s*([^\n]+)/);const context=match&&!/请在这里/.test(match[1])?match[1].trim().slice(0,30):'';return context?'按回本率选达人 · '+context:'按回本率选达人';}
async function sendTask(){if(state.busy||!state.initialized||!state.prompt.trim()||state.prompt.length>32000)return;const existing=state.records.find(r=>r.key===currentKey());if(existing){if(['create_failed','delivery_failed'].includes(existing.status))return retryTask(existing.id);notice('这版提示词已有演示任务。修改提示词可发起新任务，或在原任务继续对话。');return;}const id='操作-'+(++state.operationSeq);const record={id,key:currentKey(),prompt:state.prompt,binding:{...state.binding},envs:{...state.envs},title:titleFor(state.prompt),createdAt:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}),createKey:id+':创建',messageKey:id+':首条消息',taskId:null,status:'creating',messages:[],attempts:{create:0,message:0},dependency:state.dependency};state.records.unshift(record);state.busy=id;render();await progressOperation(record);}
async function progressOperation(record){try{if(!record.taskId){record.status='creating';record.attempts.create++;render();await wait(320);if(state.nextFailure==='create'){state.nextFailure='none';record.status='create_failed';return;}record.taskId='演示任务-'+(++state.taskSeq);record.sessionId='演示会话-'+state.taskSeq;record.shellId='演示对话-'+state.taskSeq;}record.status='sending';record.attempts.message++;render();await wait(320);if(state.nextFailure==='message'){state.nextFailure='none';record.status='delivery_failed';return;}record.status='sent';record.receiptId=record.id+':演示回执';if(!record.messages.length)record.messages.push({text:record.prompt,clientMsgId:record.messageKey,taskId:record.taskId,dirId:record.binding.id});}finally{state.busy=null;render();}}
async function retryTask(id){if(state.busy)return;const r=state.records.find(r=>r.id===id);if(!r||!['create_failed','delivery_failed'].includes(r.status))return;state.busy=r.id;await progressOperation(r);}
function beginContinue(id){const r=state.records.find(r=>r.id===id);if(!r||r.status!=='sent'||state.continuationBusy)return;state.activeContinue=id;state.continuationDraft='';render();$('continuation').focus();}
async function sendContinuation(id){if(state.continuationBusy||!state.continuationDraft.trim()||state.continuationDraft.length>32000)return;const r=state.records.find(r=>r.id===id);if(!r||r.status!=='sent')return;const text=state.continuationDraft;const clientMsgId=r.id+':补充-'+r.messages.length;state.continuationBusy=true;render();await wait(300);r.messages.push({text,clientMsgId,taskId:r.taskId,dirId:r.binding.id});state.continuationBusy=false;state.activeContinue=null;state.continuationDraft='';render();notice('已模拟向原任务补充消息，仍归属原目录；没有真实投递。');}
function updateContinuation(value){state.continuationDraft=value;const button=$('sendContinuation');if(button)button.disabled=state.continuationBusy||!value.trim()||value.length>32000;}
const statusText={creating:'正在创建（模拟）',sending:'任务已创建 · 投递中',create_failed:'创建失败（模拟）',delivery_failed:'首条消息投递失败',sent:'已入队（模拟）'};
function statusDescription(r){if(r.status==='creating')return '第一步：使用本次目录与固定操作编号创建任务。';if(r.status==='sending')return '第二步：向刚创建的任务投递提示词，尚未确认送达。';if(r.status==='create_failed')return '未确认任务创建成功。重试沿用本次操作编号与原提示词。';if(r.status==='delivery_failed')return '任务已创建，提示词尚未确认送达。重试只向这个任务投递原文。';return r.dependency==='missing'?'演示回执已接收。执行阶段待连接平台 / 补充数据；尚无达人结果。':'演示回执已接收。等待执行与数据核验；尚无达人结果。';}
function renderRecord(r){return `<article class="task-record" data-operation="${r.id}"><div class="record-top"><h3>${esc(r.title)}</h3><span class="tag ${r.status.endsWith('failed')?'bad':r.status==='sent'?'':'warn'}">${statusText[r.status]}</span></div><div class="record-meta"><span>${r.createdAt}</span><span>${r.taskId||'任务编号待创建'}</span><span class="path">${esc(r.binding.path)}</span></div><p class="record-status">${statusDescription(r)}</p>${['creating','sending'].includes(r.status)?'<div class="progress"><span></span></div>':''}<div class="record-actions">${r.status.endsWith('failed')?`<button class="subtle retry" ${state.busy?'disabled':''} onclick="retryTask('${r.id}')">${r.taskId?'重试投递原提示词':'重试本次创建'}（演示）</button>`:''}${r.status==='sent'?`<button class="subtle continue" ${state.continuationBusy?'disabled':''} onclick="beginContinue('${r.id}')">继续原任务对话（演示） →</button><span class="muted" style="font-size:11px">${r.messages.length} 条模拟消息</span>`:''}</div><details class="record-details"><summary>查看本次提示词与目录快照</summary><div class="snapshot path">专属目录：${esc(r.binding.path)}<br>目录绑定：${esc(r.binding.id)}<br>任务编号：${esc(r.taskId||'待创建')}<br>Chrome 身份：${esc(r.envs.tt||'未绑定')} / ${esc(r.envs.k||'未绑定')}</div><div class="snapshot">${esc(r.prompt)}</div>${r.messages.slice(1).map(m=>`<div class="snapshot">后续补充：${esc(m.text)}</div>`).join('')}</details>${state.activeContinue===r.id?`<div class="continue-panel"><strong style="font-size:12px">继续 ${esc(r.taskId)} 的对话</strong><p class="muted path" style="font-size:11px">仍使用 ${esc(r.binding.path)}</p><div class="field"><label for="continuation">补充说明</label><textarea id="continuation" maxlength="32000" oninput="updateContinuation(this.value)" ${state.continuationBusy?'disabled':''}>${esc(state.continuationDraft)}</textarea></div><div class="actions"><button class="primary" id="sendContinuation" ${state.continuationBusy||!state.continuationDraft.trim()?'disabled':''} onclick="sendContinuation('${r.id}')">${state.continuationBusy?'模拟投递中…':'补充到原任务（演示）'}</button><button class="secondary" ${state.continuationBusy?'disabled':''} onclick="state.activeContinue=null;render()">取消</button></div></div>`:''}</article>`;}
function renderMain(){return `<div class="intro"><div class="badge">选人 · 沿用已有合作回本方法</div><h1>把选人需求交给一个任务</h1><p>套用下面的回本率提示词，补上本次需求，再发送到 MultiCC。后续沟通留在同一个任务。</p></div><div class="demo-banner">演示模式：发送、重试、任务记录和依赖状态均为模拟。没有连接 MultiCC、隔离出口插件或真实平台；自动化桥接尚未接入。</div><div class="workspace-strip"><div><strong>新任务的专属目录 <span class="tag">本页模拟绑定</span></strong><div class="path">${esc(state.binding.path)}</div></div><button id="workspaceSettings" class="subtle" ${state.busy||state.continuationBusy?'disabled':''} onclick="openSettings()">修改设置 →</button></div><div class="layout"><main class="card"><div class="card-top"><div><h2>按合作回本率选达人</h2><p>提示词可直接修改，不需要重新填写一套筛选表。</p></div><span class="tag">提示词示例</span></div><div class="template-note"><span>↳</span><div><strong>沿用已有方法，保留本次需求</strong><br>结果应带回计算依据与缺失项。没有足够数据时，先在任务中补齐。</div></div><div class="prompt-label"><label for="prompt">本次任务提示词</label><button id="restoreTemplate" class="subtle" onclick="requestRestore()">恢复示例</button></div>${state.restorePending?'<div class="restore-box" id="restoreConfirm" role="alert">当前修改还在编辑框中。恢复示例会替换这些内容，历史任务不受影响。<div class="actions"><button id="confirmRestore" class="secondary" onclick="restoreTemplate()">确认替换为示例</button><button id="cancelRestore" class="subtle" onclick="state.restorePending=false;render()">保留当前内容</button></div></div>':''}<textarea id="prompt" maxlength="32000" oninput="updatePrompt(this.value)" spellcheck="false">${esc(state.prompt)}</textarea><div style="text-align:right;font-size:11px;color:var(--muted)" id="promptCount">${state.prompt.length} / 32000 字</div><div class="composer-bottom"><p>发送后自动建立任务并投递提示词。缺少连接或资料时，可在该任务中继续补充。</p><button class="primary" id="sendTask" ${state.busy||!state.prompt.trim()||state.prompt.length>32000?'disabled':''} onclick="sendTask()">${state.busy?'正在模拟投递…':'发送到 MultiCC（演示）'} <span aria-hidden="true">↗</span></button></div></main><aside class="aside"><section class="card side-card"><h3>准备情况</h3><div class="dependency"><span>专属工作目录</span><span class="tag">模拟绑定</span></div><div class="dependency"><span>隔离 Chrome 身份</span><span class="tag warn">${state.envs.tt||state.envs.k?'已选示例身份':'稍后配置'}</span></div><div class="dependency"><span>自动化桥接</span><span class="tag warn">尚未接入</span></div><div class="dependency"><span>TikTok Affiliate / Kalodata</span><span class="tag warn">待连接核验</span></div><p>这些缺项不阻止发起任务。执行到平台读取时，再引导连接、登录或补充资料。出口正常不等于数据可读。</p><button class="subtle" ${state.busy?'disabled':''} onclick="openSettings()" style="margin-top:8px">设置目录与 Chrome 身份 →</button></section><section class="card side-card"><h3>发送之后</h3><div class="mini-flow"><div class="flow-step"><b>1</b><div><strong>创建任务</strong><br>归属本次专属目录。</div></div><div class="flow-step"><b>2</b><div><strong>投递提示词</strong><br>失败时重试原任务，不重复创建。</div></div><div class="flow-step"><b>3</b><div><strong>在原任务继续</strong><br>补充信息、查看进度和接收结构化结果。</div></div></div></section></aside></div><section class="task-section"><div class="section-head"><h2>选人任务</h2><span>${state.records.length} 条模拟记录</span></div><div id="taskRecords">${state.records.length?state.records.map(renderRecord).join(''):'<div class="empty">发起第一个任务后，这里保留提示词、专属目录与后续对话入口。</div>'}</div></section><details class="simulation" id="simulation"><summary>演示控制与说明</summary><div class="simulation-grid"><div class="field"><label for="nextFailure">下一次模拟故障</label><select id="nextFailure" onchange="state.nextFailure=this.value"><option value="none" ${state.nextFailure==='none'?'selected':''}>不模拟故障</option><option value="create" ${state.nextFailure==='create'?'selected':''}>任务创建失败一次</option><option value="message" ${state.nextFailure==='message'?'selected':''}>创建成功，首条投递失败一次</option></select></div><div class="field"><label for="dependency">新任务的模拟执行前提</label><select id="dependency" onchange="state.dependency=this.value"><option value="missing" ${state.dependency==='missing'?'selected':''}>缺少连接或必要资料</option><option value="ready" ${state.dependency==='ready'?'selected':''}>假设已具备读取前提</option></select></div></div><p>本页仅演示界面与状态转换；即使选择“具备读取前提” async function loadDemoPlugin(){host.phase='loading';host.message='正在加载插件入口（演示）…';render();await wait(220);if(host.disk.fault==='load'){failHost('load');return false;}host.loaded=true;host.loadCount++;host.phase=state.initialized?'ready':'needs_setup';host.message=state.initialized?'达人工作台已就绪（演示）。':'插件已加载（演示），需要设置专属目录后才可发起任务。';return true;}

async function refreshPlugins(){if(host.busy)return;host.busy=true;host.error='';host.refreshCount++;try{host.phase='discovering';host.message='正在扫描宿主插件目录（演示）…';render();await wait(220);if(!host.disk){host.foundCount=0;host.phase='idle';host.message='本次发现 0 个插件。可先安装演示包，或模拟手动复制。';return;}host.foundCount=1;if(['incomplete','incompatible'].includes(host.disk.fault)){host.recognized=false;failHost(host.disk.fault);return;}host.recognized=true;if(host.loaded){host.phase=state.initialized?'ready':'needs_setup';host.message='刷新完成：发现 1 个插件，已加载的插件保持原状态；未重复加载，目录与任务保留。';return;}if(await loadDemoPlugin())host.view='workbench';}finally{host.busy=false;render();}}

function renderManager(){const progress={selected:0,validating:1,installing:2,discovering:3,loading:4,needs_setup:5,ready:5}[host.phase]??-1;return `<div class="intro"><div class="badge">宿主管理 · 安装与发现插件</div><h1>让 MultiCC 识别达人工作台</h1><p>主动安装，或复制到插件目录后刷新识别。首次加载后，继续完成插件专属目录设置。</p></div><div class="demo-banner">纯内存演示：MultiCC 已有插件刷新入口，本方案在宿主管理中补主动安装与初始化衔接。本页没有真实插件包、上传或文件操作；生命周期方案尚未接入宿主。</div><div class="manager-grid"><main class="card"><div class="card-top"><div><h2>插件安装目录</h2><p>插件程序放在宿主管理的 plugins 目录中；与后续对话使用的专属工作目录分开。</p></div><span class="tag">宿主功能</span></div><div class="helpbox"><strong>宿主插件目录（示意）</strong><div class="path host-path">宿主指定的插件根目录 / 达人工作台插件</div><p>实际路径由宿主提供，本原型不选择、不读取也不更改真实安装目录。</p></div><div class="install-actions"><button id="selectDemoPackage" class="secondary" ${host.busy||host.loaded?'disabled':''} onclick="selectDemoPackage()">模拟选择插件包</button><button id="installPlugin" class="primary" ${host.busy||host.loaded||!host.selected?'disabled':''} onclick="installDemoPlugin()">安装插件（演示）</button></div><p class="muted" style="font-size:12px">${host.selected?'已选择：'+esc(host.selected.name):'尚未选择演示包。当前静态页面不能作为安装包。'}</p><div class="install-flow">${hostPhases.map((label,i)=>`<span class="${progress>=i?'done':''}">${i+1}. ${label}</span>`).join('')}</div><div class="manager-status ${host.error?'bad':''}" role="status" aria-live="polite"><strong>${hostStatus()}</strong><p id="hostMessage">${esc(host.error||host.message)}</p>${host.error?`<p>${esc(host.message)}</p><button id="repairRetry" class="subtle" onclick="repairAndRetry()">模拟修复并重试 →</button>`:''}${host.busy?'<div class="progress"><span></span></div>':''}</div><div class="section-head"><h3>宿主识别的插件</h3><button id="refreshPlugins" class="secondary" ${host.busy?'disabled':''} onclick="refreshPlugins()">刷新识别</button></div>${host.recognized?`<article class="plugin-item" id="recognizedPlugin"><div class="record-top"><h3>达人工作台</h3><span class="tag ${host.error?'bad':!state.initialized?'warn':''}">${hostStatus()}</span></div><p>${host.loaded?(state.initialized?'专属目录已模拟绑定。后续任务归属该目录，平台数据连接仍待核验。':'入口已加载，需要先设置一个持久专属目录。'):'已识别插件包，等待入口加载成功。'}</p>${state.binding?`<div class="path host-path">${esc(state.binding.path)}</div>`:''}<div class="actions"><button id="enterWorkbench" class="primary" ${!host.loaded||host.busy?'disabled':''} onclick="enterWorkbench()">${state.initialized?'进入工作台':'继续初始化'}（演示） →</button></div></article>`:'<div class="empty" id="noRecognizedPlugin">尚无已识别插件。手动复制后，请点击“刷新识别”。</div>'}<div class="manager-metrics"><span>本次发现 <strong id="foundCount">${host.foundCount}</strong> 个</span><span>已识别 <strong>${host.recognized?1:0}</strong> 个</span><span>成功加载 <strong id="loadCount">${host.loadCount}</strong> 次</span></div><details class="simulation"><summary>演示故障与手动复制</summary><div class="field" style="margin-top:14px"><label for="packageFault">下次模拟包的状态</label><select id="packageFault" ${host.busy||host.loaded?'disabled':''} onchange="host.nextFault=this.value"><option value="none" ${host.nextFault==='none'?'selected':''}>包完整、平台兼容</option><option value="incomplete" ${host.nextFault==='incomplete'?'selected':''}>插件包不完整</option><option value="incompatible" ${host.nextFault==='incompatible'?'selected':''}>平台不兼容</option><option value="load" ${host.nextFault==='load'?'selected':''}>入口加载失败（启动失败）</option></select></div><div class="install-actions"><button id="manualCopyPlugin" class="secondary" ${host.busy||host.loaded?'disabled':''} onclick="copyDemoPackage()">模拟手动复制到 plugins</button></div><p id="diskState">模拟磁盘：${host.disk?'已有演示包':'尚无演示包'}。复制动作不会自动更新上方识别列表。</p><p>故障只影响演示包。修复后可重试；刷新已就绪插件不会重复加载，也不会清空专属目录或任务。</p></details></main><aside><section class="card host-policy"><h3>各类目录，各有用途</h3><p><strong>宿主插件目录</strong><br>承载插件程序，由 MultiCC 负责安装、刷新发现与加载。</p><p><strong>插件专属工作目录</strong><br>首次初始化时设置，承载本插件后续任务的归属与活动资料。</p><p><strong>Chrome 登录资料目录</strong><br>由现有隔离出口插件管理，不替代以上两个目录。</p></section><section class="card host-policy" style="margin-top:18px"><h3>“就绪”代表什么？</h3><p>插件入口加载完成，并完成专属目录初始化；不代表 TikTok Affiliate 或 Kalodata 已登录、可读取。</p><p>现有宿主命令按次调用，不等于常驻服务已启动。真实加载与生命周期能力待宿主接入；若插件需要常驻服务，需另行实现启停与健康检查。</p></section></aside></div>`;}
function render(){const promptFocused=document.activeElement&&document.activeElement.id==='prompt';const selection=promptFocused?[document.activeElement.selectionStart,document.activeElement.selectionEnd]:null;const manager=host.view==='manager';$('brandText').textContent=manager?'MultiCC · 插件管理（演示）':'达人工作台';$('brandMark').textContent=manager?'M':'达';$('backToPlugins').classList.toggle('hidden',manager);$('app').innerHTML=manager?renderManager():(!state.initialized||state.settings?renderSetup():renderMain());if(promptFocused&&$('prompt')){$('prompt').focus();$('prompt').setSelectionRange(...selection);}}
render();
